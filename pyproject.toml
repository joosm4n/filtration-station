[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "wso_spaceteamspro"
# import-names = "wso_stp"
version = "0.0.1"
authors = [
  { name="Kieran O'Toole", email="kotoole0703@gmail.com" },
]
description = "A package for Western Sydney Orbital to use for the SpaceTeamsPro competition. Contains a Tracker, GoalPlanner and BurnGovernor."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/joosm4n/filtration-station"
Issues = "https://github.com/joosm4n/filtration-station/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"

[tool.cibuildwheel]
build-frontend = "build[uv]"
skip = "*-musllinux*"
